name: Generate selected-language audiobook playlists
on:
  push:
    branches: [main, master, filtered-language-library]
    paths:
      - "by-language/**"
      - "by-author/**"
      - "by-genre/**"
      - "by-title/**"
      - "generate_filtered_playlists.js"
      - ".github/workflows/generate-filtered-playlists.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: audiobook-catalogue-write
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate selected-language playlists
        run: node generate_filtered_playlists.js
      - name: Commit generated filtered playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add filtered/
          if git diff --cached --quiet; then
            echo "Filtered playlists are already up to date."
          else
            git commit -m "Generate selected-language audiobook playlists"
            # Another unrelated workflow or commit may have advanced main during generation.
            git fetch --depth=20 origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
