name: Generate complete audiobook playlists

on:
  push:
    branches: [main, master]
    paths:
      - "by-author/**"
      - "by-genre/**"
      - "by-language/**"
      - "by-title/**"
      - "generate_playlists.js"
      - ".github/workflows/generate-playlists.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audiobook-catalogue-write
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate master and category playlists
        run: node generate_playlists.js

      - name: Commit generated playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u playlists/
          if git diff --cached --quiet; then
            echo "Generated playlists are already up to date."
          else
            git commit -m "Update complete and categorized audiobook playlists"
            # Another generator may have advanced main during this run.
            git fetch --depth=20 origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
