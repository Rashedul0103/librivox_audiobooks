name: Build CloudStream extensions

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudstream-extension-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: audioaz-cloudstream

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Build plugins and manifest
        run: gradle make makePluginsJson ensureJarCompatibility

      - name: Prepare published repository
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/audioaz-publish"
          mkdir -p "$out"
          cp repo.json "$out/repo.json"
          cp build/plugins.json "$out/plugins.json"
          find . -type f \( -name '*.cs3' -o -name '*.jar' \) -path '*/build/*' -exec cp {} "$out/" \;
          test -n "$(find "$out" -maxdepth 1 -name '*.cs3' -print -quit)"
          cat > "$out/README.md" <<'EOM'
          # AudioAZ and Audible CloudStream repository

          Generated automatically from the audioaz-cloudstream source branch.
          EOM

      - name: Publish package repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/audioaz-publish"
          git init
          git checkout --orphan builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build AudioAZ and Audible plugins from $GITHUB_SHA"
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$TARGET_REPO.git"
          git push --force origin HEAD:builds
